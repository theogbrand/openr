input:
  json_file_path: 'extracted_problems_and_answers.json'

output:
  file_prefix: 'math'
  log_file_path: 'logs/{initial_rollouts}_{num_rollouts}_{max_iterations}.log'

processing:
  initial_rollouts: 8
  num_rollouts: 8
  max_iterations: 10

model:
  # supported model_types: "hf", "openai", "anthropic"
  model_type: "hf"
  model_name: "Qwen/Qwen2.5-Math-7B-Instruct"
  model_args:
    max_tokens: 200
    temperature_range: [0.7, 1.0]